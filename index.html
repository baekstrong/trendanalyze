<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>영상 찾기</title>
<style>
  :root { --bg:#fff; --fg:#1d1d1f; --muted:#6b7280; --line:#e5e7eb; --accent:#16a34a; --head:#f9fafb; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111; --fg:#eee; --muted:#9ca3af; --line:#2a2a2a; --head:#1a1a1a; } }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.4 -apple-system, "Apple SD Gothic Neo", sans-serif; background:var(--bg); color:var(--fg); }
  header { position:sticky; top:0; z-index:3; background:var(--bg); border-bottom:1px solid var(--line); padding:8px 16px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .tabs { display:flex; gap:4px; }
  .tabs button { border:none; background:none; font-weight:600; color:var(--muted); padding:8px 12px; border-radius:6px; }
  .tabs button.on { color:var(--accent); background:var(--head); outline:none; }
  .bar { padding:10px 16px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; border-bottom:1px solid var(--line); }
  [hidden] { display:none !important; }
  #chSummary { padding:12px 16px; }
  #chSummary .grid { grid-template-columns:repeat(auto-fill, minmax(170px, 1fr)); }
  .profile { width:40px; height:40px; border-radius:50%; object-fit:cover; display:block; margin:auto; }
  .chhead { display:flex; gap:12px; align-items:center; margin-bottom:10px; }
  .chhead img { width:56px; height:56px; border-radius:50%; }
  input, select, button { font:inherit; padding:6px 10px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg); }
  button { cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.on { outline:2px solid var(--accent); }
  #q { width:220px; }
  #status { color:var(--muted); margin-left:auto; }
  .wrap { overflow-x:auto; }
  table { border-collapse:collapse; width:100%; min-width:1100px; }
  th, td { padding:8px; border-bottom:1px solid var(--line); text-align:center; white-space:nowrap; }
  th { background:var(--head); position:sticky; top:0; font-weight:600; cursor:pointer; user-select:none; }
  th[data-k=""] { cursor:default; }
  td.title { text-align:left; white-space:normal; max-width:420px; }
  td.title a { color:inherit; text-decoration:none; }
  td.title a:hover { text-decoration:underline; }
  .ch { color:var(--muted); font-size:12px; }
  .thumb { position:relative; display:inline-block; }
  .thumb img { width:120px; height:68px; object-fit:cover; border-radius:4px; display:block; }
  .thumb span { position:absolute; right:3px; bottom:3px; background:#000c; color:#fff; font-size:11px; padding:0 4px; border-radius:3px; }
  .Great { color:#2563eb; font-weight:700; } .Good { color:#16a34a; font-weight:600; }
  .Normal { color:var(--muted); } .Bad { color:#f97316; } .Worst { color:#dc2626; font-weight:600; }
  .num { font-variant-numeric:tabular-nums; }
  .x { border:none; background:none; color:var(--muted); padding:0 4px; }
  .empty { padding:40px; text-align:center; color:var(--muted); }
  #shade { position:fixed; inset:0; background:#0006; z-index:5; display:none; }
  #panel { position:fixed; top:0; right:0; bottom:0; width:min(600px, 100%); z-index:6; background:var(--bg); border-left:1px solid var(--line);
           overflow-y:auto; padding:16px; transform:translateX(100%); transition:transform .2s; }
  body.detail #shade { display:block; }
  body.detail #panel { transform:none; }
  #panel h2 { font-size:17px; margin:12px 0 4px; }
  #panel h3 { font-size:14px; margin:20px 0 8px; padding-top:12px; border-top:1px solid var(--line); }
  #panel .big { width:100%; aspect-ratio:16/9; object-fit:cover; border-radius:8px; background:var(--head); display:block; }
  .grid { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; }
  .grid div { background:var(--head); border-radius:6px; padding:8px; }
  .grid b { display:block; font-size:16px; font-variant-numeric:tabular-nums; }
  .grid small, .muted { color:var(--muted); font-size:12px; }
  .tags span { display:inline-block; margin:0 4px 4px 0; padding:2px 8px; border-radius:99px; background:var(--head); font-size:12px; }
  .desc { white-space:pre-wrap; font-size:13px; max-height:200px; overflow-y:auto; background:var(--head); padding:8px; border-radius:6px; }
  .cmt { padding:8px 0; border-bottom:1px solid var(--line); font-size:13px; white-space:pre-wrap; }
  .close { position:sticky; top:0; float:right; }
  .ai h4 { margin:14px 0 6px; font-size:14px; }
  .ai ul { margin:4px 0 8px; padding-left:18px; font-size:13px; }
  .ai p { margin:6px 0; font-size:13px; }
  .ai ol { margin:4px 0 8px; padding-left:20px; font-size:13px; }
  .ai li { margin-bottom:4px; }
  .tag { display:inline-block; padding:0 6px; border-radius:4px; background:var(--head); font-size:11px; }
</style>
</head>
<body>
<header>
  <nav class="tabs">
    <button data-view="video">영상 찾기</button>
    <button data-view="channels">채널 찾기</button>
    <button data-view="analysis">채널 분석</button>
    <button data-view="collected">수집한 영상</button>
  </nav>
  <input id="key" type="password" placeholder="YouTube API 키" autocomplete="off" style="width:160px">
  <span id="status"></span>
</header>
<div class="bar" data-for="video">
  <form id="f" style="display:contents">
    <input id="q" placeholder="키워드 입력" required>
    <select id="order" title="정렬 기준(API)">
      <option value="relevance">관련도순</option><option value="viewCount">조회수순</option><option value="date">최신순</option>
    </select>
    <select id="period" title="게시 기간">
      <option value="">전체 기간</option><option value="7">1주</option><option value="30">1개월</option>
      <option value="180">6개월</option><option value="365">1년</option>
    </select>
    <select id="pages" title="가져올 양 (페이지당 50개, 검색 100유닛)">
      <option value="1">50개</option><option value="2" selected>100개</option><option value="4">200개</option><option value="10">500개</option>
    </select>
    <button class="primary">검색</button>
    <button type="button" id="refresh" title="저장된 결과 무시하고 다시 검색 (API 사용)">↻ 새로 검색</button>
  </form>
  <select id="hist" title="저장된 검색 결과 (API 사용 안 함)" style="max-width:240px"></select>
  <button id="histDel" title="선택한 내역 삭제">내역 삭제</button>
</div>
<div class="bar" data-for="channels">
  <form id="chForm" style="display:contents">
    <input id="chQ" placeholder="채널 키워드" required style="width:200px">
    <select id="chOrder" title="정렬 기준(API)">
      <option value="relevance">관련도순</option><option value="viewCount">조회수순</option><option value="videoCount">영상 수순</option>
    </select>
    <select id="chPages" title="가져올 양 (페이지당 50개, 검색 100유닛)">
      <option value="1" selected>50개</option><option value="2">100개</option><option value="4">200개</option>
    </select>
    <label title="채널마다 최근 영상 20개 조회수를 받아 영상성과를 계산 (채널당 2유닛)"><input type="checkbox" id="chPerf" checked> 영상성과 계산</label>
    <button class="primary">검색</button>
    <button type="button" id="chRefresh" title="저장된 결과 무시하고 다시 검색 (API 사용)">↻ 새로 검색</button>
  </form>
  <select id="chHist" title="저장된 채널 검색 (API 사용 안 함)" style="max-width:240px"></select>
  <button id="chHistDel">내역 삭제</button>
</div>
<div class="bar" data-for="analysis">
  <form id="anForm" style="display:contents">
    <input id="anQ" placeholder="채널 주소, @핸들, 채널명" required style="width:260px">
    <select id="anCount" title="분석할 최근 영상 수 (50개당 약 2유닛)">
      <option value="50">최근 50개</option><option value="100" selected>최근 100개</option><option value="200">최근 200개</option><option value="500">최근 500개</option>
    </select>
    <button class="primary">분석</button>
  </form>
  <select id="anList" title="분석한 채널 (API 사용 안 함)" style="max-width:240px"></select>
  <button id="anRefresh" title="지금 채널을 최신 데이터로 다시 분석">↻ 최신화</button>
  <button id="anDel">목록에서 삭제</button>
</div>
<div class="bar" data-for="collected">
  <select id="folder" title="폴더"></select>
  <button id="folderNew">새 폴더</button>
  <button id="folderDel" title="폴더 삭제 (영상은 기본 폴더로)">폴더 삭제</button>
  <select id="moveTo" title="선택한 영상을 옮길 폴더"></select>
  <button id="move">선택 이동</button>
</div>
<div class="bar" data-for="video analysis collected">
  <select id="len" title="영상 길이">
    <option value="">전체 길이</option><option value="short">쇼츠(3분 이하)</option><option value="long">롱폼</option>
  </select>
  <input id="minViews" type="number" min="0" step="1000" placeholder="최소 조회수" style="width:110px">
  <span data-for="video analysis"><select id="collectTo" title="수집할 폴더"></select> <button id="collect">선택 수집</button></span>
  <button id="csv">CSV</button>
  <select id="aiTool" title="Claude 분석 (선택한 영상이 있으면 그 영상, 없으면 조회수 상위)">
    <option value="">AI 분석…</option>
    <option value="patterns">결과 패턴 요약</option>
    <option value="keywords">키워드 확장</option>
    <option value="ideas">댓글로 아이디어</option>
    <option value="plan">내 영상 기획</option>
  </select>
</div>
<section id="chSummary" data-for="analysis"></section>
<div class="wrap" data-for="channels">
  <table>
    <thead id="chHead"><tr>
      <th data-k="">프로필</th>
      <th data-k="" style="text-align:left">채널명</th>
      <th data-k="publishedAt">채널 개설일</th>
      <th data-k="subs">구독자</th>
      <th data-k="subRate" title="구독자 ÷ 누적 조회수">조회수대비 구독전환</th>
      <th data-k="dailySubs" title="구독자 ÷ 개설 후 일수">일평균 구독전환</th>
      <th data-k="videoPerfRate" title="최근 영상 20개 조회수 중앙값 ÷ 구독자">영상성과</th>
      <th data-k="views">누적 조회수</th>
      <th data-k="videoCount">총 영상 수</th>
      <th data-k="" title="이 채널 숨기기">숨김</th>
    </tr></thead>
    <tbody id="chRows"></tbody>
  </table>
</div>
<div class="wrap" data-for="video analysis collected">
  <table>
    <thead><tr>
      <th data-k=""><input type="checkbox" id="all"></th>
      <th data-k="">CC</th>
      <th data-k="durationSec">썸네일</th>
      <th data-k="" style="text-align:left">제목</th>
      <th data-k="views">조회수</th>
      <th data-k="subs">구독자</th>
      <th data-k="contributionRate" title="영상 조회수 ÷ 채널 평균 조회수">기여도</th>
      <th data-k="performanceRate" title="영상 조회수 ÷ 구독자 수">성과도</th>
      <th data-k="chVideos">총 영상 수</th>
      <th data-k="publishedAt">게시일</th>
      <th data-k="" title="이 채널 숨기기">채널</th>
    </tr></thead>
    <tbody id="rows"></tbody>
  </table>
</div>
<div id="shade"></div>
<aside id="panel" aria-label="영상 상세"></aside>
<script src="metrics.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const API = 'https://www.googleapis.com/youtube/v3/';
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};

let rows = [];                                   // 마지막 검색 결과
let collected = store.get('collected', []);      // 수집한 영상(행 그대로 저장)
let blocked = new Set(store.get('blockedChannels', []));
let view = 'video';                              // video | channels | analysis | collected
let chVideos = [];                               // 채널 분석 중인 채널의 영상
let folders = store.get('folders', ['기본']);
// 탭마다 표에 보여줄 영상 목록
const source = () => (view === 'collected' ? collected : view === 'analysis' ? chVideos : rows);

function setView(v) {
  view = v;
  document.querySelectorAll('.tabs button').forEach((b) => b.classList.toggle('on', b.dataset.view === v));
  document.querySelectorAll('[data-for]').forEach((el) => (el.hidden = !el.dataset.for.split(' ').includes(v)));
  sort = { k: null, dir: -1 };
  if (v === 'channels') renderChannels(); else render();
}
let sort = { k: null, dir: -1 };

$('key').value = store.get('apiKey', '');
$('key').onchange = () => store.set('apiKey', $('key').value.trim());

function addQuota(units) {
  const today = new Date().toISOString().slice(0, 10);   // 쿼터는 태평양 시간 자정 리셋이라 근사치
  const q = store.get('quota', {});
  const used = (q.date === today ? q.used : 0) + units;
  store.set('quota', { date: today, used });
  return used;
}

async function yt(path, params) {
  const url = API + path + '?' + new URLSearchParams({ ...params, key: $('key').value.trim() });
  const res = await fetch(url);
  const body = await res.json();
  if (!res.ok) throw new Error(body.error?.message || res.statusText);
  return body;
}

const chunk = (a, n) => Array.from({ length: Math.ceil(a.length / n) }, (_, i) => a.slice(i * n, i * n + n));

// 검색 내역: 같은 조건이면 API를 다시 부르지 않고 저장된 결과를 쓴다
const HISTORY_MAX = 30;
let searches = store.get('history', []);
const searchOpts = () => ({ q: $('q').value.trim(), order: $('order').value, period: $('period').value, pages: $('pages').value });
const optsKey = (o) => [o.q.toLowerCase(), o.order, o.period, o.pages].join('|');
const optLabel = (id) => $(id).querySelector(`option[value="${$(id).value}"]`)?.textContent || '';

function saveHistory(opts, list) {
  const label = [opts.q, optLabel('order'), optLabel('period'), optLabel('pages')].join(' · ');
  searches = [{ key: optsKey(opts), label, opts, at: Date.now(), rows: list },
             ...searches.filter((h) => h.key !== optsKey(opts))].slice(0, HISTORY_MAX);
  // localStorage 5MB를 넘으면 오래된 내역부터 버린다
  for (;;) {
    try { localStorage.setItem('history', JSON.stringify(searches)); break; }
    catch { if (searches.length <= 1) break; searches.pop(); }
  }
  renderHistory();
}

function renderHistory() {
  const when = (t) => new Date(t).toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
  $('hist').innerHTML = `<option value="">검색 내역 (${searches.length})</option>` +
    searches.map((h, i) => `<option value="${i}">${esc(h.label)} · ${h.rows.length}개 · ${when(h.at)}</option>`).join('');
}

function loadHistory(h) {
  Object.entries(h.opts).forEach(([k, v]) => ($(k).value = v));
  if (view !== 'video') setView('video');
  rows = h.rows;
  sort = { k: null, dir: -1 };
  render();
  setStatus(`저장된 결과 ${rows.length}개 · ${new Date(h.at).toLocaleString('ko-KR')} 검색 · 0유닛`);
}

async function search(e, force = false) {
  e?.preventDefault();
  const opts = searchOpts();
  const saved = searches.find((h) => h.key === optsKey(opts));
  if (saved && !force) return loadHistory(saved);
  if (!$('key').value.trim()) return setStatus('API 키를 먼저 넣어주세요');
  store.set('apiKey', $('key').value.trim());
  if (view !== 'video') setView('video');
  setStatus('검색 중…');
  try {
    const base = { part: 'id', type: 'video', maxResults: 50, q: $('q').value, order: $('order').value,
                   regionCode: 'KR', relevanceLanguage: 'ko' };
    if ($('period').value) base.publishedAfter = new Date(Date.now() - $('period').value * 864e5).toISOString();
    let ids = [], pageToken, units = 0;
    for (let i = 0; i < +$('pages').value; i++) {
      const r = await yt('search', pageToken ? { ...base, pageToken } : base);
      units += 100;
      ids.push(...r.items.map((it) => it.id.videoId));
      if (!(pageToken = r.nextPageToken)) break;
    }
    ids = [...new Set(ids)];
    const videos = [];
    for (const c of chunk(ids, 50)) {
      videos.push(...(await yt('videos', { part: 'snippet,statistics,contentDetails', id: c.join(',') })).items);
      units++;
    }
    const chIds = [...new Set(videos.map((v) => v.snippet.channelId))];
    const channels = {};
    for (const c of chunk(chIds, 50)) {
      for (const ch of (await yt('channels', { part: 'statistics', id: c.join(',') })).items) channels[ch.id] = ch;
      units++;
    }
    rows = videos.map((v) => toRow(v, channels[v.snippet.channelId]));
    saveHistory(opts, rows);
    sort = { k: null, dir: -1 };
    render();
    setStatus(`${rows.length}개 · 이번 검색 ${units}유닛 · 오늘 약 ${addQuota(units).toLocaleString()}/10,000`);
  } catch (err) {
    setStatus('오류: ' + err.message);
  }
}

function visible() {
  const minViews = +$('minViews').value || 0, len = $('len').value;
  const folder = $('folder').value;
  let list = source().filter((r) =>
    (view !== 'video' || !blocked.has(r.channelId)) &&
    (view !== 'collected' || !folder || (r.folder || '기본') === folder) &&
    r.views >= minViews &&
    (!len || (len === 'short' ? r.durationSec <= 180 : r.durationSec > 180)));
  if (sort.k) list = [...list].sort((a, b) => {
    const x = a[sort.k], y = b[sort.k];
    const nx = Number.isFinite(x) || typeof x === 'string', ny = Number.isFinite(y) || typeof y === 'string';
    if (!nx || !ny) return nx ? -1 : ny ? 1 : 0;          // 값 없는 행은 항상 아래
    return (x > y ? 1 : x < y ? -1 : 0) * sort.dir;
  });
  return list;
}

const fmt = (n) => Number.isFinite(n) ? n.toLocaleString() : '-';
const fmtDur = (s) => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`);

function render() {
  const list = visible();
  $('all').checked = false;
  $('rows').innerHTML = list.length ? list.map((r) => `
    <tr>
      <td><input type="checkbox" data-id="${esc(r.id)}"></td>
      <td>${r.caption ? 'CC' : ''}</td>
      <td><a class="thumb" href="#" data-open="${esc(r.id)}"><img src="${esc(r.thumb || '')}" alt="" loading="lazy"><span>${fmtDur(r.durationSec)}</span></a></td>
      <td class="title"><a href="#" data-open="${esc(r.id)}">${esc(r.title)}</a><div class="ch">${esc(r.channelTitle)}</div></td>
      <td class="num">${fmt(r.views)}</td>
      <td class="num">${fmt(r.subs)}</td>
      <td class="${r.contribution}" title="${Number.isFinite(r.contributionRate) ? r.contributionRate.toFixed(2) + '배' : ''}">${r.contribution}</td>
      <td class="${r.performance}" title="${Number.isFinite(r.performanceRate) ? r.performanceRate.toFixed(2) + '배' : ''}">${r.performance}</td>
      <td class="num">${fmt(r.chVideos)}</td>
      <td>${esc((r.publishedAt || '').slice(2, 10).replace(/-/g, '.'))}</td>
      <td>${view === 'collected'
        ? `<span class="muted">${esc(r.folder || '기본')}</span> <button class="x" data-uncollect="${esc(r.id)}" title="수집 해제">✕</button>`
        : view === 'video' ? `<button class="x" data-block="${esc(r.channelId)}" title="${esc(r.channelTitle)} 숨기기">✕</button>`
        : ''}</td>
    </tr>`).join('')

// 분석 형식이 바뀐 작업은 버전을 올려 예전 저장본을 쓰지 않는다
const AI_VER = { reason: 2 };
const aiKey = (task, id) => `ai:${task}${AI_VER[task] ? 'v' + AI_VER[task] : ''}:${id}`;

// 잘된 이유: 제목·썸네일·내용(자막은 서버가 yt-dlp로 받음) + 같은 채널 잘된/안된 영상 썸네일 비교
function reasonPayload(id, row, v, thumb, recent, recentList, comments) {
  const ranked = [...recentList].sort((a, b) => b.views - a.views).filter((r) => r.thumb);
  const compare = [...ranked.slice(0, 2).map((r) => ({ ...r, label: '채널에서 잘된 영상' })),
                   ...ranked.slice(-1).map((r) => ({ ...r, label: '채널에서 안된 영상' }))]
    .filter((r, i, a) => a.findIndex((x) => x.thumb === r.thumb) === i);
  return {
    videoId: id,
    video: { title: row.title, views: row.views, likes: row.likes, comments: row.comments, publishedAt: row.publishedAt.slice(0, 10),
             durationSec: row.durationSec, description: (v.snippet.description || '').slice(0, 1500), tags: (v.snippet.tags || []).slice(0, 15) },
    channel: { title: row.channelTitle, subscribers: row.subs, recentMedianViews: recent && Math.round(recent.median) },
    recentVideos: recentList.map(({ thumb: _, ...r }) => r),
    topComments: comments.slice(0, 10).map((c) => `${c.textDisplay.slice(0, 300)} (좋아요 ${c.likeCount})`),
    thumbOrder: ['이 영상', ...compare.map((r) => `${r.label}: ${r.title} (조회수 ${r.views})`)],
    thumbUrls: [thumb, ...compare.map((r) => r.thumb)],
  };
}

// 결과를 localStorage에 저장하고, 있으면 다시 부르지 않는다
async function callAI(task, data, key, force) {
  const cached = store.get(key, null);
  if (cached && !force) return cached;
  const res = await fetch('/ai', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ task, data }) });
  const body = await res.json().catch(() => ({ error: 'server.py로 연 화면에서만 AI를 쓸 수 있어요' }));
  if (!res.ok) throw new Error(body.error);
  const saved = { at: Date.now(), result: body.result };
  store.set(key, saved);
  return saved;
}

function showAI(task, saved) {
  $('ai-' + task).innerHTML = `<h4>${AI_TITLE[task]} <button class="x" data-ai="${task}" data-redo="1" title="다시 분석">↻</button>
    <span class="muted">${new Date(saved.at).toLocaleString('ko-KR')}</span></h4>${AI_VIEW[task](saved.result)}`;
}

async function runAI(task, force) {
  const ctx = detailCtx, key = aiKey(task, ctx.id);
  if (!store.get(key, null) || force) $('ai-' + task).innerHTML = `<p class="muted">${AI_TITLE[task]} 중… (${AI_WAIT[task] || '보통 10~40초'})</p>`;
  try {
    const saved = await callAI(task, ctx.payload[task], key, force);
    if (detailCtx?.id === ctx.id) showAI(task, saved);   // 그사이 다른 영상을 열었으면 저장만
  } catch (err) {
    if (detailCtx?.id === ctx.id) $('ai-' + task).innerHTML = `<p>AI 오류: ${esc(err.message)}</p>`;
  }
}

const hash = (s) => [...s].reduce((h, c) => (h * 31 + c.charCodeAt(0)) | 0, 7).toString(36);
const byViews = (a) => [...a].sort((x, y) => y.views - x.views);
const brief = (r) => ({ title: r.title, channel: r.channelTitle, views: r.views, subscribers: r.subs,
  contribution: r.contribution, performance: r.performance, durationSec: r.durationSec, published: (r.publishedAt || '').slice(0, 10) });

// 선택한 영상, 없으면 지금 보이는 목록에서 조회수 상위 n개
function pickRows(n) {
  const ids = new Set(checkedIds());
  const pool = source();
  const picked = pool.filter((r) => ids.has(r.id));
  return { list: (picked.length ? picked : byViews(visible())).slice(0, n), selected: picked.length > 0 };
}

async function reportData(task) {
  const keyword = { collected: '(수집한 영상)', analysis: `(채널: ${currentChannel?.title || ''})` }[view] || $('q').value.trim();
  if (task === 'patterns' || task === 'keywords') {
    const top = byViews(visible()).slice(0, 40);
    if (!top.length) throw new Error('먼저 검색하세요');
    const data = task === 'patterns'
      ? { keyword, videos: top.map(brief), thumbOrder: top.slice(0, 8).map((r) => r.title),
          thumbUrls: top.slice(0, 8).map((r) => r.thumb).filter(Boolean) }
      : { keyword, titles: top.map((r) => r.title), tags: [...new Set(top.flatMap((r) => r.tags || []))].slice(0, 80) };
    return { data, ids: top.map((r) => r.id), note: `조회수 상위 ${top.length}개 기준` };
  }
  const { list: picked, selected } = pickRows(10);
  if (!picked.length) throw new Error('먼저 검색하거나 영상을 선택하세요');
  const note = `${selected ? '선택한' : '조회수 상위'} ${picked.length}개 기준`;
  if (task === 'ideas') {
    const videos = [];
    for (const r of picked) {
      let comments = [];
      try {
        comments = (await yt('commentThreads', { part: 'snippet', videoId: r.id, order: 'relevance', maxResults: 20, textFormat: 'plainText' }))
          .items.map((c) => c.snippet.topLevelComment.snippet.textDisplay.slice(0, 300));
      } catch { /* 댓글 막힌 영상은 건너뜀 */ }
      videos.push({ title: r.title, comments });
    }
    setStatus(`댓글 ${picked.length}유닛 · 오늘 약 ${addQuota(picked.length).toLocaleString()}/10,000`);
    return { data: { keyword, videos }, ids: picked.map((r) => r.id), note };
  }
  // plan
  const myChannel = prompt('내 채널은 어떤 채널인가요? (주제·대상·톤)', store.get('myChannel', ''));
  if (!myChannel) throw new Error('채널 설명이 있어야 기획할 수 있어요');
  store.set('myChannel', myChannel);
  return { data: { myChannel, keyword, references: picked.map((r) => ({ ...brief(r), tags: r.tags || [] })),
                   thumbUrls: picked.slice(0, 4).map((r) => r.thumb).filter(Boolean) },
           ids: picked.map((r) => r.id).concat(myChannel), note };
}

async function openReport(task, force = false) {
  const P = $('panel');
  detailCtx = null;
  document.body.classList.add('detail');
  const head = `<button class="close" onclick="closeDetail()">닫기 ✕</button><h2>AI · ${REPORT[task].title}</h2>`;
  P.innerHTML = head + '<p class="muted">데이터 모으는 중…</p>';
  try {
    const { data, ids, note } = await reportData(task);
    const key = `ai:${task}:${hash(ids.join(','))}`;
    if (!store.get(key, null) || force) P.innerHTML = head + `<p class="muted">${note} · 분석 중… (보통 20~60초)</p>`;
    const saved = await callAI(task, data, key, force);
    P.innerHTML = head + `<p class="muted">${note} · ${new Date(saved.at).toLocaleString('ko-KR')}
      <button class="x" data-report="${task}" title="다시 분석">↻ 다시 분석</button></p>
      <div class="ai">${REPORT[task].view(saved.result)}</div>`;
  } catch (err) {
    P.innerHTML = head + `<p>AI 오류: ${esc(err.message)}</p>`;
  }
}

// 상세 1건 ≈ 5유닛: 영상, 채널, 채널 업로드 목록, 최근 영상 통계, 댓글
async function openDetail(id) {
  const P = $('panel');
  document.body.classList.add('detail');
  P.innerHTML = '<p class="muted">불러오는 중…</p>';
  try {
    const v = (await yt('videos', { part: 'snippet,statistics,contentDetails,topicDetails', id })).items[0];
    if (!v) throw new Error('영상을 찾을 수 없어요 (삭제·비공개)');
    const ch = (await yt('channels', { part: 'snippet,statistics,contentDetails', id: v.snippet.channelId })).items[0];
    const row = toRow(v, ch);
    let units = 2, recent = null, comments = [], commentNote = '';

    const uploads = ch?.contentDetails?.relatedPlaylists?.uploads;
    let recentList = [];
    if (uploads) {
      const ids = (await yt('playlistItems', { part: 'contentDetails', playlistId: uploads, maxResults: 50 }))
        .items.map((it) => it.contentDetails.videoId);
      recentList = (await yt('videos', { part: 'snippet,statistics', id: ids.join(',') })).items
        .filter((s) => s.id !== id)
        .map((s) => ({ title: s.snippet.title, views: +s.statistics.viewCount, publishedAt: s.snippet.publishedAt.slice(0, 10),
                       thumb: (s.snippet.thumbnails.medium || s.snippet.thumbnails.default)?.url }));
      recent = compareToRecent(row.views, recentList.map((s) => s.views));
      units += 2;
    }
    try {
      comments = (await yt('commentThreads', { part: 'snippet', videoId: id, order: 'relevance', maxResults: 20, textFormat: 'plainText' }))
        .items.map((c) => c.snippet.topLevelComment.snippet);
      units++;
    } catch (err) { commentNote = /disabled/i.test(err.message) ? '댓글이 막혀 있어요' : '댓글을 못 불러왔어요: ' + err.message; }
    setStatus(`상세 ${units}유닛 · 오늘 약 ${addQuota(units).toLocaleString()}/10,000`);

    const t = v.snippet.thumbnails;
    const thumb = (t.maxres || t.standard || t.high || t.medium || t.default).url;
    const days = Math.max(1, (Date.now() - new Date(row.publishedAt)) / 864e5);
    const likes = v.statistics.likeCount;
    P.innerHTML = `
      <button class="close" onclick="closeDetail()">닫기 ✕</button>
      <a href="${esc(thumb)}" target="_blank" rel="noopener" title="원본 썸네일 열기"><img class="big" src="${esc(thumb)}" alt="썸네일"></a>
      <h2>${esc(row.title)}</h2>
      <div class="muted">${esc(row.channelTitle)} · ${new Date(row.publishedAt).toLocaleString('ko-KR')} · ${fmtDur(row.durationSec)}
        · ${v.contentDetails.definition === 'hd' ? 'HD' : 'SD'}${row.caption ? ' · 자막' : ''}${CATEGORY[v.snippet.categoryId] ? ' · ' + CATEGORY[v.snippet.categoryId] : ''}</div>
      <p><a href="https://youtu.be/${esc(id)}" target="_blank" rel="noopener">▶ 유튜브에서 보기</a>
        · <button class="x" data-analyze="${esc(row.channelId)}"><b>이 채널 분석 →</b></button></p>

      <h3>AI 분석 <span class="muted">Claude · 추정치</span></h3>
      ${Object.entries(AI_TITLE).map(([k, t]) => `<button data-ai="${k}">${t}</button>`).join(' ')}
      ${Object.keys(AI_TITLE).map((k) => `<div id="ai-${k}" class="ai"></div>`).join('')}

      <h3>반응</h3>
      <div class="grid">
        ${stat('조회수', fmt(row.views), `하루 평균 ${fmt(Math.round(row.views / days))}`)}
        ${stat('좋아요', likes === undefined ? '숨김' : fmt(+likes), likes === undefined ? '' : `조회 대비 ${pct(+likes, row.views)}`)}
        ${stat('댓글', fmt(row.comments), `조회 대비 ${pct(row.comments, row.views)}`)}
      </div>

      <h3>채널 안에서의 위치</h3>
      <div class="grid">
        ${stat('기여도', `<span class="${row.contribution}">${row.contribution}</span>`, Number.isFinite(row.contributionRate) ? `채널 평균의 ${row.contributionRate.toFixed(1)}배` : '')}
        ${stat('성과도', `<span class="${row.performance}">${row.performance}</span>`, Number.isFinite(row.performanceRate) ? `구독자의 ${row.performanceRate.toFixed(1)}배` : '')}
        ${recent ? stat('최근 영상 중', `${recent.rank}위 / ${recent.total + 1}`, `최근 중앙값 ${fmt(Math.round(recent.median))} · ${recent.ratio.toFixed(1)}배`) : stat('최근 영상 중', '-')}
      </div>
      <p class="muted">구독자 ${fmt(row.subs)} · 영상 ${fmt(row.chVideos)}개 · 채널 개설 ${ch ? new Date(ch.snippet.publishedAt).toLocaleDateString('ko-KR') : '-'}${ch?.snippet.country ? ' · ' + esc(ch.snippet.country) : ''}</p>

      <h3>태그</h3>
      <div class="tags">${(v.snippet.tags || []).map((g) => `<span>${esc(g)}</span>`).join('') || '<span class="muted">태그 없음</span>'}</div>

      <h3>설명</h3>
      <div class="desc">${esc(v.snippet.description || '설명 없음')}</div>

      <h3>인기 댓글 ${comments.length ? comments.length + '개' : ''}</h3>
      <p class="muted">시청층은 공개되지 않아서, 댓글 말투와 내용으로 짐작하는 게 현실적인 방법이에요.</p>
      ${comments.map((c) => `<div class="cmt">${esc(c.textDisplay)}<div class="muted">👍 ${fmt(c.likeCount)} · ${new Date(c.publishedAt).toLocaleDateString('ko-KR')}</div></div>`).join('')
        || `<p class="muted">${esc(commentNote || '댓글 없음')}</p>`}

      <h3>볼 수 없는 정보</h3>
      <p class="muted">시청지속시간, 시청자 연령·성별·지역, 노출 클릭률, 유입 경로는 YouTube Analytics 데이터라 채널 주인만 볼 수 있어요.</p>`;
    P.scrollTop = 0;
    detailCtx = { id, payload: {
      audience: { title: row.title, channel: row.channelTitle, description: (v.snippet.description || '').slice(0, 2000),
        tags: v.snippet.tags || [], views: row.views, subscribers: row.subs,
        comments: comments.map((c) => `${c.textDisplay.slice(0, 500)} (좋아요 ${c.likeCount})`) },
      thumbnail: { title: row.title, thumbUrl: thumb },
      reason: reasonPayload(id, row, v, thumb, recent, recentList, comments),
    } };
    for (const task of Object.keys(AI_VIEW)) {
      const cached = store.get(aiKey(task, id), null);
      if (cached) showAI(task, cached);
    }
  } catch (err) {
    P.innerHTML = `<button class="close" onclick="closeDetail()">닫기 ✕</button><p>오류: ${esc(err.message)}</p>`;
  }
}

</script>
<script src="channels.js"></script>
</body>
</html>
