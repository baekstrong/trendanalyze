<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>영상 찾기</title>
<style>
  :root { --bg:#fff; --fg:#1d1d1f; --muted:#6b7280; --line:#e5e7eb; --accent:#16a34a; --head:#f9fafb; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111; --fg:#eee; --muted:#9ca3af; --line:#2a2a2a; --head:#1a1a1a; } }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.4 -apple-system, "Apple SD Gothic Neo", sans-serif; background:var(--bg); color:var(--fg); }
  header { position:sticky; top:0; z-index:2; background:var(--bg); border-bottom:1px solid var(--line); padding:12px 16px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  input, select, button { font:inherit; padding:6px 10px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg); }
  button { cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.on { outline:2px solid var(--accent); }
  #q { width:220px; }
  #status { color:var(--muted); margin-left:auto; }
  .wrap { overflow-x:auto; }
  table { border-collapse:collapse; width:100%; min-width:1100px; }
  th, td { padding:8px; border-bottom:1px solid var(--line); text-align:center; white-space:nowrap; }
  th { background:var(--head); position:sticky; top:0; font-weight:600; cursor:pointer; user-select:none; }
  th[data-k=""] { cursor:default; }
  td.title { text-align:left; white-space:normal; max-width:420px; }
  td.title a { color:inherit; text-decoration:none; }
  td.title a:hover { text-decoration:underline; }
  .ch { color:var(--muted); font-size:12px; }
  .thumb { position:relative; display:inline-block; }
  .thumb img { width:120px; height:68px; object-fit:cover; border-radius:4px; display:block; }
  .thumb span { position:absolute; right:3px; bottom:3px; background:#000c; color:#fff; font-size:11px; padding:0 4px; border-radius:3px; }
  .Great { color:#2563eb; font-weight:700; } .Good { color:#16a34a; font-weight:600; }
  .Normal { color:var(--muted); } .Bad { color:#f97316; } .Worst { color:#dc2626; font-weight:600; }
  .num { font-variant-numeric:tabular-nums; }
  .x { border:none; background:none; color:var(--muted); padding:0 4px; }
  .empty { padding:40px; text-align:center; color:var(--muted); }
</style>
</head>
<body>
<header>
  <input id="key" type="password" placeholder="YouTube API 키" autocomplete="off" style="width:160px">
  <form id="f" style="display:contents">
    <input id="q" placeholder="키워드 입력" required>
    <select id="order" title="정렬 기준(API)">
      <option value="relevance">관련도순</option><option value="viewCount">조회수순</option><option value="date">최신순</option>
    </select>
    <select id="period" title="게시 기간">
      <option value="">전체 기간</option><option value="7">1주</option><option value="30">1개월</option>
      <option value="180">6개월</option><option value="365">1년</option>
    </select>
    <select id="pages" title="가져올 양 (페이지당 50개, 검색 100유닛)">
      <option value="1">50개</option><option value="2" selected>100개</option><option value="4">200개</option><option value="10">500개</option>
    </select>
    <button class="primary">검색</button>
  </form>
  <select id="len" title="영상 길이">
    <option value="">전체 길이</option><option value="short">쇼츠(3분 이하)</option><option value="long">롱폼</option>
  </select>
  <input id="minViews" type="number" min="0" step="1000" placeholder="최소 조회수" style="width:110px">
  <button id="collect">선택 수집</button>
  <button id="showCollected">수집한 영상</button>
  <button id="csv">CSV</button>
  <span id="status"></span>
</header>
<div class="wrap">
  <table>
    <thead><tr>
      <th data-k=""><input type="checkbox" id="all"></th>
      <th data-k="">CC</th>
      <th data-k="durationSec">썸네일</th>
      <th data-k="" style="text-align:left">제목</th>
      <th data-k="views">조회수</th>
      <th data-k="subs">구독자</th>
      <th data-k="contributionRate" title="영상 조회수 ÷ 채널 평균 조회수">기여도</th>
      <th data-k="performanceRate" title="영상 조회수 ÷ 구독자 수">성과도</th>
      <th data-k="chVideos">총 영상 수</th>
      <th data-k="publishedAt">게시일</th>
      <th data-k="" title="이 채널 숨기기">채널</th>
    </tr></thead>
    <tbody id="rows"></tbody>
  </table>
</div>
<script src="metrics.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const API = 'https://www.googleapis.com/youtube/v3/';
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};

let rows = [];                                   // 마지막 검색 결과
let collected = store.get('collected', []);      // 수집한 영상(행 그대로 저장)
let blocked = new Set(store.get('blockedChannels', []));
let showingCollected = false;
let sort = { k: null, dir: -1 };

$('key').value = store.get('apiKey', '');
$('key').onchange = () => store.set('apiKey', $('key').value.trim());

function addQuota(units) {
  const today = new Date().toISOString().slice(0, 10);   // 쿼터는 태평양 시간 자정 리셋이라 근사치
  const q = store.get('quota', {});
  const used = (q.date === today ? q.used : 0) + units;
  store.set('quota', { date: today, used });
  return used;
}

async function yt(path, params) {
  const url = API + path + '?' + new URLSearchParams({ ...params, key: $('key').value.trim() });
  const res = await fetch(url);
  const body = await res.json();
  if (!res.ok) throw new Error(body.error?.message || res.statusText);
  return body;
}

const chunk = (a, n) => Array.from({ length: Math.ceil(a.length / n) }, (_, i) => a.slice(i * n, i * n + n));

async function search(e) {
  e.preventDefault();
  if (!$('key').value.trim()) return setStatus('API 키를 먼저 넣어주세요');
  store.set('apiKey', $('key').value.trim());
  showingCollected = false; $('showCollected').classList.remove('on');
  setStatus('검색 중…');
  try {
    const base = { part: 'id', type: 'video', maxResults: 50, q: $('q').value, order: $('order').value,
                   regionCode: 'KR', relevanceLanguage: 'ko' };
    if ($('period').value) base.publishedAfter = new Date(Date.now() - $('period').value * 864e5).toISOString();
    let ids = [], pageToken, units = 0;
    for (let i = 0; i < +$('pages').value; i++) {
      const r = await yt('search', pageToken ? { ...base, pageToken } : base);
      units += 100;
      ids.push(...r.items.map((it) => it.id.videoId));
      if (!(pageToken = r.nextPageToken)) break;
    }
    ids = [...new Set(ids)];
    const videos = [];
    for (const c of chunk(ids, 50)) {
      videos.push(...(await yt('videos', { part: 'snippet,statistics,contentDetails', id: c.join(',') })).items);
      units++;
    }
    const chIds = [...new Set(videos.map((v) => v.snippet.channelId))];
    const channels = {};
    for (const c of chunk(chIds, 50)) {
      for (const ch of (await yt('channels', { part: 'statistics', id: c.join(',') })).items) channels[ch.id] = ch;
      units++;
    }
    rows = videos.map((v) => toRow(v, channels[v.snippet.channelId]));
    sort = { k: null, dir: -1 };
    render();
    setStatus(`${rows.length}개 · 이번 검색 ${units}유닛 · 오늘 약 ${addQuota(units).toLocaleString()}/10,000`);
  } catch (err) {
    setStatus('오류: ' + err.message);
  }
}

function visible() {
  const minViews = +$('minViews').value || 0, len = $('len').value;
  let list = (showingCollected ? collected : rows).filter((r) =>
    (showingCollected || !blocked.has(r.channelId)) &&
    r.views >= minViews &&
    (!len || (len === 'short' ? r.durationSec <= 180 : r.durationSec > 180)));
  if (sort.k) list = [...list].sort((a, b) => {
    const x = a[sort.k], y = b[sort.k];
    const nx = Number.isFinite(x) || typeof x === 'string', ny = Number.isFinite(y) || typeof y === 'string';
    if (!nx || !ny) return nx ? -1 : ny ? 1 : 0;          // 값 없는 행은 항상 아래
    return (x > y ? 1 : x < y ? -1 : 0) * sort.dir;
  });
  return list;
}

const fmt = (n) => Number.isFinite(n) ? n.toLocaleString() : '-';
const fmtDur = (s) => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`);

function render() {
  const list = visible();
  $('all').checked = false;
  $('rows').innerHTML = list.length ? list.map((r) => `
    <tr>
      <td><input type="checkbox" data-id="${esc(r.id)}"></td>
      <td>${r.caption ? 'CC' : ''}</td>
      <td><a class="thumb" href="https://youtu.be/${esc(r.id)}" target="_blank" rel="noopener"><img src="${esc(r.thumb || '')}" alt="" loading="lazy"><span>${fmtDur(r.durationSec)}</span></a></td>
      <td class="title"><a href="https://youtu.be/${esc(r.id)}" target="_blank" rel="noopener">${esc(r.title)}</a><div class="ch">${esc(r.channelTitle)}</div></td>
      <td class="num">${fmt(r.views)}</td>
      <td class="num">${fmt(r.subs)}</td>
      <td class="${r.contribution}" title="${Number.isFinite(r.contributionRate) ? r.contributionRate.toFixed(2) + '배' : ''}">${r.contribution}</td>
      <td class="${r.performance}" title="${Number.isFinite(r.performanceRate) ? r.performanceRate.toFixed(2) + '배' : ''}">${r.performance}</td>
      <td class="num">${fmt(r.chVideos)}</td>
      <td>${r.publishedAt ? r.publishedAt.slice(2, 10).replace(/-/g, '.') : ''}</td>
      <td>${showingCollected
        ? `<button class="x" data-uncollect="${esc(r.id)}" title="수집 해제">✕</button>`
        : `<button class="x" data-block="${esc(r.channelId)}" title="${esc(r.channelTitle)} 숨기기">✕</button>`}</td>
    </tr>`).join('')
    : `<tr><td colspan="11" class="empty">${showingCollected ? '수집한 영상이 없어요' : '키워드를 검색해 보세요'}</td></tr>`;
}

function setStatus(t) { $('status').textContent = t; }
const checkedIds = () => [...document.querySelectorAll('#rows input:checked')].map((c) => c.dataset.id);

$('f').onsubmit = search;
$('len').onchange = $('minViews').oninput = render;
$('all').onchange = (e) => document.querySelectorAll('#rows input').forEach((c) => (c.checked = e.target.checked));

document.querySelector('thead').onclick = (e) => {
  const k = e.target.closest('th')?.dataset.k;
  if (!k) return;
  sort = { k, dir: sort.k === k ? -sort.dir : -1 };
  render();
};

$('rows').onclick = (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.block) {
    blocked.add(b.dataset.block);
    store.set('blockedChannels', [...blocked]);
  } else if (b.dataset.uncollect) {
    collected = collected.filter((r) => r.id !== b.dataset.uncollect);
    store.set('collected', collected);
  }
  render();
};

$('collect').onclick = () => {
  const ids = new Set(checkedIds());
  const have = new Set(collected.map((r) => r.id));
  const add = rows.filter((r) => ids.has(r.id) && !have.has(r.id));
  collected = [...add, ...collected];
  store.set('collected', collected);
  setStatus(`${add.length}개 수집 · 총 ${collected.length}개`);
};

$('showCollected').onclick = () => {
  showingCollected = !showingCollected;
  $('showCollected').classList.toggle('on', showingCollected);
  render();
};

$('csv').onclick = () => {
  const cols = ['id', 'title', 'channelTitle', 'views', 'subs', 'contribution', 'contributionRate',
                'performance', 'performanceRate', 'chVideos', 'durationSec', 'publishedAt', 'likes', 'comments'];
  const cell = (v) => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const csv = '﻿' + [cols.join(','), ...visible().map((r) => cols.map((c) => cell(r[c])).join(','))].join('\n');
  const a = Object.assign(document.createElement('a'), {
    href: URL.createObjectURL(new Blob([csv], { type: 'text/csv' })),
    download: `영상찾기_${$('q').value || '수집'}.csv`,
  });
  a.click();
  URL.revokeObjectURL(a.href);
};

render();
</script>
</body>
</html>
